<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahayak Demo</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--muted:#6b6a66;--ok:#1f6f4a}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#f2f1ed;--muted:#a3a29c;--ok:#4cc38a}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
main{max-width:420px;text-align:center}h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);margin:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px}
</style>
</head>
<body><main>
<h1>Sahayak</h1>
<p><span class="dot"></span>All systems running</p>
</main></body>
</html>
